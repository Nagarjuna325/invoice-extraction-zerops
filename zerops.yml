# One config, two services. Zerops reads this from the repo root and each
# service picks the `setup:` block matching its hostname.

zerops:
  # =================================================================
  # api - FastAPI + the full quadruple-hybrid ML stack
  # =================================================================
  - setup: api
    build:
      base: ubuntu/python@3.12

      # No apt step. DNS is unreachable from the build container in this region
      # (archive.ubuntu.com, security.ubuntu.com and github.com all fail to
      # resolve), so apt can't fetch package lists. Every system dependency has
      # a pip-only equivalent instead:
      #   libgl1/libglib  -> opencv-python-headless needs neither
      #   poppler-utils   -> PyMuPDF bundles its own PDF renderer
      #   tesseract-ocr   -> RapidOCR is pure Python + ONNX

      buildCommands:
        # No venv: `python -m venv` fails here because ensurepip's bundled data
        # is missing from the image and python3-venv can't be apt-installed.
        # `pip --target` gives the same result — a self-contained package dir
        # inside the deployed tree, which is what matters since build and run
        # are separate containers and only deployFiles crosses between them.
        - cd backend && python -m pip --version
        # CPU-only torch. The default wheel drags in ~2.5GB of CUDA that never runs here.
        - cd backend && python -m pip install --target=.python-deps --index-url https://download.pytorch.org/whl/cpu torch torchvision
        - cd backend && python -m pip install --target=.python-deps -r requirements.txt
        - cd backend && python -m pip install --target=.python-deps rapidocr
        # Bake the four models in. Without this, every cold start stalls on a ~4GB
        # HuggingFace download before it can answer a single request.
        - cd backend && export PYTHONPATH=$(pwd)/.python-deps && export HF_HOME=$(pwd)/.hf_cache && python download_impira.py
        - cd backend && export PYTHONPATH=$(pwd)/.python-deps && export HF_HOME=$(pwd)/.hf_cache && python download_layoutlm.py
        - cd backend && export PYTHONPATH=$(pwd)/.python-deps && export HF_HOME=$(pwd)/.hf_cache && python download_donut.py

      # The trailing /~ flattens backend/ contents to the deploy root, so app/
      # and .venv/ land where the start command expects them.
      deployFiles:
        - backend/~

      cache:
        - backend/.python-deps
        - backend/.hf_cache

    run:
      base: ubuntu/python@3.12

      # No apt at runtime either - same DNS problem, and nothing here needs it.

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        # Wired from the managed Postgres service named 'db'.
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}

        HOST: 0.0.0.0
        PORT: "8000"
        DEBUG: "False"
        ENVIRONMENT: production
        LOG_LEVEL: INFO

        # Models are baked in; stay offline so no request blocks on HuggingFace.
        HF_HOME: /var/www/.hf_cache
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"

        TESSERACT_LANG: eng

        # No Tesseract binary in this image (apt is unreachable), so every code
        # path that shells out to it is off. RapidOCR covers OCR instead.
        USE_TESSERACT_OCR_VOTER: "0"
        USE_TESSERACT_OCR: "0"
        OCR_MATRIX_ENABLE_TESSERACT: "0"
        ENABLE_AMOUNT_COLUMN_REOCR: "0"
        ENABLE_FOOTER_TOTAL_EXTRACT: "0"

        # The four-model consensus core is untouched by any of the above.
        ENABLE_TEMPLATE_VOTER: "1"
        STORE_OCR_TOKENS: "1"
        STORE_OCR_TEXTS: "1"
        AUTO_ANCHOR_CORRECTIONS: "1"
        ENABLE_ADVANCED_OCR_PIPELINE: "1"
        PRE_OCR_TARGET_DPI: "300"
        PRE_OCR_SMALL_FONT_DPI: "350"
        PRE_OCR_AUTO_DETECT_PAGE_SIZE: "1"
        PRE_OCR_PAGE_SIZE_FALLBACK: letter
        PRE_OCR_ENABLE_DESKEW: "1"

        # Full OCR matrix + fusion. TrOCR (~1.3GB) and PaddleOCR run on top of the
        # four main models, so this needs a container above ~8GB RAM to survive
        # extraction. Sized accordingly in the service scaling config.
        PRE_OCR_GENERATE_VARIANTS: "1"
        ENABLE_OCR_MATRIX: "1"
        ENABLE_OCR_FUSION: "1"
        ENABLE_LABEL_ANCHORED_DATES_TEXT: "1"

        # pydantic-settings parses List[str] fields as JSON.
        ALLOWED_ORIGINS: '["https://${app_zeropsSubdomain}", "http://localhost:5173", "http://localhost:3000"]'

        # Packages were installed with pip --target, so the runtime needs them on the path.
        PYTHONPATH: /var/www/.python-deps

        UPLOAD_DIR: /var/www/uploads
        LOG_FILE: /var/www/logs/app.log

      # RAM/disk/container counts are service-level settings, not pipeline settings -
      # they live in zerops-project-import.yml (verticalAutoscaling) and the GUI.
      # Four models resident at once needs ~8GB; one container only, since each
      # additional replica would load its own full model set.

      # No healthCheck block: it's optional, and its schema rejected both the
      # int and duration forms of failureTimeout. Zerops' default port check
      # is sufficient. Add one back later if model-load time trips it.

      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300

  # =================================================================
  # app - React 19 + Vite, built to static files
  # =================================================================
  - setup: app
    build:
      base: nodejs@22

      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build

      deployFiles:
        - frontend/dist/~

      cache:
        - frontend/node_modules

      envVariables:
        # Vite inlines VITE_* at build time. The /api/v1 suffix matters -
        # src/config reads this straight into the axios baseURL.
        VITE_API_BASE_URL: ${api_zeropsSubdomain}/api/v1
        VITE_APP_NAME: Invoice Extraction System
        VITE_MAX_FILE_SIZE: "10485760"

    run:
      base: static

      ports:
        - port: 80
          httpSupport: true

      # NOTE: react-router needs unmatched paths to fall through to index.html.
      # Zerops does that via an nginx config (siteConfigPath), not a `routing`
      # block - wire it up when this service is actually deployed. Until then
      # deep links 404 while the app root works fine.
