# One config, two services. Zerops reads this from the repo root and each
# service picks the `setup:` block matching its hostname.

zerops:
  # =================================================================
  # api — FastAPI + the full quadruple-hybrid ML stack
  # =================================================================
  - setup: api
    build:
      base: python@3.12

      # System libraries the ML stack links against.
      # opencv needs libGL/glib, pymupdf+docling need poppler, pytesseract needs the binary.
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends
          tesseract-ocr tesseract-ocr-eng
          libgl1 libglib2.0-0 libsm6 libxext6 libxrender1
          poppler-utils

      buildCommands:
        # Packages must live inside the deployed tree: build and run are separate
        # containers, and only deployFiles crosses between them.
        - cd backend && python -m venv .venv
        - cd backend && . .venv/bin/activate && pip install --upgrade pip wheel
        # CPU-only torch. The default wheel drags in ~2.5GB of CUDA that never runs here.
        - cd backend && . .venv/bin/activate && pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
        - cd backend && . .venv/bin/activate && pip install -r requirements.txt
        - cd backend && . .venv/bin/activate && pip install rapidocr
        # Bake the four models in. Without this, every cold start stalls on a ~4GB
        # HuggingFace download before it can answer a single request.
        - cd backend && export HF_HOME=$(pwd)/.hf_cache && . .venv/bin/activate && python download_impira.py
        - cd backend && export HF_HOME=$(pwd)/.hf_cache && . .venv/bin/activate && python download_layoutlm.py
        - cd backend && export HF_HOME=$(pwd)/.hf_cache && . .venv/bin/activate && python download_donut.py

      # The trailing /~ flattens backend/ contents to the deploy root, so app/
      # and .venv/ land where the start command expects them.
      deployFiles:
        - backend/~

      cache:
        - backend/.venv
        - backend/.hf_cache

    run:
      base: python@3.12

      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends
          tesseract-ocr tesseract-ocr-eng
          libgl1 libglib2.0-0 libsm6 libxext6 libxrender1
          poppler-utils

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        # Wired from the managed Postgres service named 'db'.
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}

        HOST: 0.0.0.0
        PORT: "8000"
        DEBUG: "False"
        ENVIRONMENT: production
        LOG_LEVEL: INFO

        # Models are baked in; stay offline so no request blocks on HuggingFace.
        HF_HOME: /var/www/.hf_cache
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"

        TESSERACT_PATH: /usr/bin/tesseract
        TESSERACT_LANG: eng

        # Full quadruple-hybrid, matching the local .env.
        USE_TESSERACT_OCR_VOTER: "1"
        ENABLE_TEMPLATE_VOTER: "1"
        STORE_OCR_TOKENS: "1"
        STORE_OCR_TEXTS: "1"
        AUTO_ANCHOR_CORRECTIONS: "1"
        ENABLE_ADVANCED_OCR_PIPELINE: "1"
        PRE_OCR_TARGET_DPI: "300"
        PRE_OCR_SMALL_FONT_DPI: "350"
        PRE_OCR_AUTO_DETECT_PAGE_SIZE: "1"
        PRE_OCR_PAGE_SIZE_FALLBACK: letter
        PRE_OCR_ENABLE_DESKEW: "1"
        PRE_OCR_GENERATE_VARIANTS: "1"
        ENABLE_OCR_MATRIX: "1"
        ENABLE_OCR_FUSION: "1"
        ENABLE_LABEL_ANCHORED_DATES_TEXT: "1"

        # pydantic-settings parses List[str] fields as JSON.
        ALLOWED_ORIGINS: '["https://${app_zeropsSubdomain}", "http://localhost:5173", "http://localhost:3000"]'

        UPLOAD_DIR: /var/www/uploads
        LOG_FILE: /var/www/logs/app.log

      # Four transformer models resident simultaneously. Below ~8GB this OOMs mid-extraction.
      resources:
        minRam: 8
        maxRam: 16
        minDisk: 20
        maxDisk: 40

      # Extraction runs in-process via BackgroundTasks, so a restart kills in-flight
      # jobs. Pin to one container — each additional one loads its own 8GB model set.
      minContainers: 1
      maxContainers: 1

      healthCheck:
        httpGet:
          port: 8000
          path: /
        # Loading four models takes minutes. Don't let the platform reap it first.
        initialDelaySeconds: 300
        periodSeconds: 30
        failureTimeout: 120

      start: .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300

  # =================================================================
  # app — React 19 + Vite, built to static files
  # =================================================================
  - setup: app
    build:
      base: nodejs@22

      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build

      deployFiles:
        - frontend/dist/~

      cache:
        - frontend/node_modules

      envVariables:
        # Vite inlines VITE_* at build time. The /api/v1 suffix matters —
        # src/config reads this straight into the axios baseURL.
        VITE_API_BASE_URL: ${api_zeropsSubdomain}/api/v1
        VITE_APP_NAME: Invoice Extraction System
        VITE_MAX_FILE_SIZE: "10485760"

    run:
      base: static

      ports:
        - port: 80
          httpSupport: true

      # SPA: react-router owns the routes, so unmatched paths must fall
      # through to index.html instead of 404ing.
      routing:
        root: /
        errorPage: index.html
